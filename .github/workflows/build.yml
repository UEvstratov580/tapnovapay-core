name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: "5.15.2"
        host: "windows"
        target: "desktop"
        arch: "win64_msvc2019_64"
        
    - name: Build
      run: |
        qmake tapnovapay-gui.pro
        nmake
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: TapNovaPay-Windows
        path: release/
        
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: "5.15.2"
        host: "linux"
        target: "desktop"
        arch: "gcc_64"
        
    - name: Build
      run: |
        qmake tapnovapay-gui.pro
        make
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: TapNovaPay-Linux
        path: TapNovaPay-Core/
        
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: "5.15.2"
        host: "mac"
        target: "desktop"
        arch: "clang_64"
        
    - name: Build
      run: |
        qmake tapnovapay-gui.pro
        make
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: TapNovaPay-macOS
        path: TapNovaPay-Core.app/
        
  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, "refs/tags/")
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          TapNovaPay-Windows/**/*
          TapNovaPay-Linux/**/*
          TapNovaPay-macOS/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
