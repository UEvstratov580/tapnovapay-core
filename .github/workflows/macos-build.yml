name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        brew install qt5 openssl curl sqlite3
        
    - name: Setup environment
      run: |
        echo "/opt/homebrew/opt/qt5/bin" >> $GITHUB_PATH
        echo "CPPFLAGS=-I/opt/homebrew/opt/openssl/include" >> $GITHUB_ENV
        echo "LDFLAGS=-L/opt/homebrew/opt/openssl/lib" >> $GITHUB_ENV
        
    - name: Fix .pro file
      run: |
        sed -i '' 's/-lws2_32//g' tapnovapay-gui.pro
        sed -i '' 's/-lcrypt32//g' tapnovapay-gui.pro
        if ! grep -q "INCLUDEPATH += /opt/homebrew/opt/openssl/include" tapnovapay-gui.pro; then
          echo "INCLUDEPATH += /opt/homebrew/opt/openssl/include" >> tapnovapay-gui.pro
        fi
        if ! grep -q "LIBS += -L/opt/homebrew/opt/openssl/lib" tapnovapay-gui.pro; then
          echo "LIBS += -L/opt/homebrew/opt/openssl/lib" >> tapnovapay-gui.pro
        fi
        
    - name: Build
      run: |
        qmake tapnovapay-gui.pro CONFIG+=sdk_no_version_check
        make -j$(sysctl -n hw.ncpu)
        
    - name: Package app
      run: |
        mkdir -p TapNovaPay-Core
        APP_DIR=$(find . -maxdepth 1 -type d -name "*.app" | head -1)
        if [ -d "$APP_DIR" ]; then
          echo "✅ Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" TapNovaPay-Core/
        else
          echo "❌ App bundle not found!"
          ls -la
          exit 1
        fi
        zip -r TapNovaPay-Core-macOS.zip TapNovaPay-Core/
        echo "✅ Package created: TapNovaPay-Core-macOS.zip"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TapNovaPay-macOS
        path: TapNovaPay-Core-macOS.zip
        
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          https://api.github.com/repos/UEvstratov580/tapnovapay-core/releases/tags/${GITHUB_REF#refs/tags/} \
          | grep -o '"id":\s*[0-9]*' | head -1 | grep -o '[0-9]*')
        
        if [ -n "$RELEASE_ID" ]; then
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            https://uploads.github.com/repos/UEvstratov580/tapnovapay-core/releases/$RELEASE_ID/assets?name=TapNovaPay-Core-macOS.zip \
            --data-binary @TapNovaPay-Core-macOS.zip
          echo "✅ Uploaded to Release!"
        else
          echo "❌ Release not found"
          exit 1
        fi
