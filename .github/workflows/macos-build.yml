name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        brew install qt5 openssl curl sqlite3
        
    - name: Setup environment
      run: |
        echo "/opt/homebrew/opt/qt5/bin" >> $GITHUB_PATH
        echo "CPPFLAGS=-I/opt/homebrew/opt/openssl/include" >> $GITHUB_ENV
        echo "LDFLAGS=-L/opt/homebrew/opt/openssl/lib" >> $GITHUB_ENV
        
    - name: Fix .pro file
      run: |
        sed -i '' 's/-lws2_32//g' tapnovapay-gui.pro
        sed -i '' 's/-lcrypt32//g' tapnovapay-gui.pro
        if ! grep -q "INCLUDEPATH += /opt/homebrew/opt/openssl/include" tapnovapay-gui.pro; then
          echo "INCLUDEPATH += /opt/homebrew/opt/openssl/include" >> tapnovapay-gui.pro
        fi
        if ! grep -q "LIBS += -L/opt/homebrew/opt/openssl/lib" tapnovapay-gui.pro; then
          echo "LIBS += -L/opt/homebrew/opt/openssl/lib" >> tapnovapay-gui.pro
        fi
        
    - name: Build
      run: |
        qmake tapnovapay-gui.pro CONFIG+=sdk_no_version_check
        make -j$(sysctl -n hw.ncpu)
        
    - name: Package app
      run: |
        # Створюємо папку
        mkdir -p TapNovaPay-Core
        
        # Шукаємо .app бандл
        APP_DIR=$(find . -maxdepth 1 -type d -name "*.app" | head -1)
        if [ -d "$APP_DIR" ]; then
          echo "✅ Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" TapNovaPay-Core/
        else
          echo "❌ App bundle not found!"
          ls -la
          exit 1
        fi
        
        # Створюємо архів
        zip -r TapNovaPay-Core-macOS.zip TapNovaPay-Core/
        echo "✅ Package created: TapNovaPay-Core-macOS.zip"
        
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: TapNovaPay-Core-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifact
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: TapNovaPay-macOS
        path: TapNovaPay-Core-macOS.zip
